services:
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
    environment:
      # CHANGE THESE BEFORE DEPLOYING: this username/password pair grants full
      # API access, and the dispatcher key must match CAIRN_DISPATCHER_API_KEY
      # on the cairn-dispatcher service below.
      CAIRN_AUTH_USERNAME: "admin"
      CAIRN_AUTH_PASSWORD: "change-me"
      CAIRN_DISPATCHER_API_KEY: "change-me-dispatcher"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      cairn-server:
        condition: service_healthy
    environment:
      # Must match CAIRN_DISPATCHER_API_KEY on the cairn-server service above.
      CAIRN_DISPATCHER_API_KEY: "change-me-dispatcher"
    restart: unless-stopped
    command: ["uv", "run", "cairn", "dispatch", "--server-url", "http://cairn-server:8000", "--name", "default"]
